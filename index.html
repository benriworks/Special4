    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="日本の祝日法を端末内で計算し、今年の連休と有休の使いどきを一枚の地図にするツール。営業日計算・和暦変換も。通信なし・オフラインで動きます。" />

    <meta name="theme-color" content="#101826" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="日付のミカタ — 有休1日で、連休はもっと伸びる" />
    <meta property="og:description" content="日本の祝日法を端末内で計算し、今年の連休と有休の使いどきを一枚の地図に。営業日計算・和暦変換も。" />

    <title>日付のミカタ — 有休1日で、連休はもっと伸びる</title>
    <script>
      try {
        var t = localStorage.getItem('hizuke.theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
      // If nothing has mounted after a few seconds the bundle failed to load — typically GitHub Pages
      // serving the unbuilt source because Settings → Pages → Source is "Deploy from a branch".
      setTimeout(function () {
        var root = document.getElementById('root')
        if (!root || root.hasChildNodes()) return
        root.innerHTML =
          '<div style="max-width:40em;margin:15vh auto;padding:0 16px;font:16px/1.8 system-ui,sans-serif;color:#1B1F2A">' +
          '<h1 style="font-size:22px;line-height:1.3">アプリを読み込めませんでした</h1>' +
          '<p>GitHub Pages で公開している場合は、リポジトリの <b>Settings → Pages → Build and deployment → Source</b> を「<b>GitHub Actions</b>」にしてください。「Deploy from a branch」のままだと、ビルド前のファイルがそのまま配信されて画面が真っ白になります。</p>' +
          '<p>切り替え後、Actions の「Deploy to GitHub Pages」が完了すると表示されます。</p>' +
          '</div>'
      }, 4000)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
